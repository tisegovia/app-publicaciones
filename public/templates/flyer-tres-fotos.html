<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-background: #0d0d1a;
    --color-text-primary: #ffffff;
    --color-text-secondary: rgba(255,255,255,0.72);
    --color-price-bg: #e63946;
    --color-accent: #f4a261;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { width: 1080px; height: 1920px; overflow: hidden; background: var(--color-background); }
  body {
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: var(--color-background);
    font-family: 'DM Sans', sans-serif;
    transform-origin: top left;
    position: relative;
  }
  .flyer {
    width: 1080px; height: 1920px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* ── Main image ── */
  .image-main-area {
    position: relative;
    width: 100%;
    height: 780px;
    flex-shrink: 0;
    overflow: hidden;
    background: #111122;
  }
  .product-image-main {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .image-main-fade {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 200px;
    background: linear-gradient(to bottom, transparent, var(--color-background));
    pointer-events: none;
  }
  /* ── Condition badge ── */
  .product-condition-badge {
    position: absolute;
    top: 48px; left: 48px;
    display: none;
    padding: 14px 32px;
    border-radius: 100px;
    background: var(--color-accent);
    color: #000;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  /* ── Details row ── */
  .details-row {
    display: flex;
    gap: 16px;
    padding: 0 16px;
    height: 380px;
    flex-shrink: 0;
    margin-top: -20px;
    position: relative;
    z-index: 2;
  }
  .detail-slot {
    flex: 1;
    overflow: hidden;
    border-radius: 20px;
    background: #111122;
    border: 2px solid rgba(255,255,255,0.08);
  }
  .product-image-detail-1,
  .product-image-detail-2 {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  /* ── Info area ── */
  .info-area {
    flex: 1;
    padding: 32px 72px 72px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .info-area::before {
    content: '';
    position: absolute;
    top: 0; left: 72px;
    width: 80px; height: 4px;
    background: var(--color-price-bg);
    border-radius: 2px;
  }
  .price-row {
    display: flex;
    align-items: center;
    margin-bottom: 28px;
    margin-top: 20px;
  }
  .price-tag {
    display: inline-flex;
    align-items: center;
    background: var(--color-price-bg);
    padding: 16px 44px;
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(230,57,70,0.45);
  }
  .product-price {
    font-family: 'Archivo Black', sans-serif;
    font-size: 88px;
    color: #fff;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .product-title {
    font-family: 'Archivo Black', sans-serif;
    font-size: 64px;
    color: var(--color-text-primary);
    line-height: 1.05;
    margin-bottom: 24px;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    word-break: break-word;
  }
  .product-description {
    font-size: 38px;
    color: var(--color-text-secondary);
    line-height: 1.4;
    flex: 1;
    margin-bottom: 32px;
  }
  .contact-line {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 24px 40px;
    background: rgba(255,255,255,0.07);
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.10);
  }
  .contact-icon { font-size: 40px; flex-shrink: 0; }
  .product-contact {
    font-size: 34px;
    color: var(--color-text-secondary);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<div class="flyer">
  <!-- Main image -->
  <div class="image-main-area">
    <img class="product-image-main" src="%%IMAGE_MAIN_SRC%%" alt="Producto" style="display:%%IMAGE_MAIN_DISPLAY%%">
    <div class="image-main-fade"></div>
    <span class="product-condition-badge" style="display:%%CONDITION_DISPLAY%%">%%CONDITION%%</span>
  </div>

  <!-- Detail images -->
  <div class="details-row">
    <div class="detail-slot">
      <img class="product-image-detail-1" src="%%IMAGE_DETAIL_1_SRC%%" alt="Detalle 1">
    </div>
    <div class="detail-slot">
      <img class="product-image-detail-2" src="%%IMAGE_DETAIL_2_SRC%%" alt="Detalle 2">
    </div>
  </div>

  <!-- Info -->
  <div class="info-area">
    <div class="price-row">
      <div class="price-tag">
        <span class="product-price">%%PRICE%%</span>
      </div>
    </div>
    <h1 class="product-title">%%TITLE%%</h1>
    <p class="product-description">%%DESCRIPTION%%</p>
    <div class="contact-line">
      <span class="contact-icon">📱</span>
      <span class="product-contact">%%CONTACT%%</span>
    </div>
  </div>
</div>
<script>
(function(){
  function scale(){
    var s=Math.min((window.innerWidth||1080)/1080,(window.innerHeight||1920)/1920);
    document.body.style.transform='scale('+s+')';
    document.documentElement.style.cssText='width:'+(1080*s)+'px;height:'+(1920*s)+'px;overflow:hidden;';
  }
  scale();
  window.addEventListener('resize',scale);
})();
</script>
</body>
</html>
